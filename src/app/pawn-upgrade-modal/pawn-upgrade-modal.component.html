<div>
    @for(contentArr of content ; track $index) {
        <div>
            @for (pieceToSelect of contentArr; track $index) {
                <button class="piece-to-select" (click)="handlePieceSelected(pieceToSelect)"> 
                <piece [key]="pieceToSelect"/>    
                </button>
            }
        </div>
    }
</div>
